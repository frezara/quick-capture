name: QuickCapture
options:
  bundleIdPrefix: com.quickcapture
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

packages:
  HotKey:
    url: https://github.com/soffes/HotKey
    from: 0.2.0

targets:
  QuickCapture:
    type: application
    platform: macOS
    sources:
      - path: Sources/QuickCapture
      # CodeMirror-based markdown editor — bundled as a folder reference so
      # editor.html and editor.js stay co-located inside `EditorWeb/` in the
      # built .app, where `Bundle.main.url(forResource:..., subdirectory:)`
      # can find them.
      - path: editor-web/dist
        buildPhase: resources
        type: folder
    dependencies:
      - package: HotKey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quickcapture.app
        PRODUCT_NAME: "Quick Capture"
        PRODUCT_MODULE_NAME: QuickCapture
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Quick Capture"
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Quick Capture"
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: QuickCapture.entitlements

  QuickCaptureTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/QuickCaptureTests
    dependencies:
      - target: QuickCapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quickcapture.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Quick Capture.app/Contents/MacOS/Quick Capture"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  QuickCapture:
    build:
      targets:
        QuickCapture: all
        QuickCaptureTests: [test]
    test:
      targets:
        - QuickCaptureTests
      gatherCoverageData: true
