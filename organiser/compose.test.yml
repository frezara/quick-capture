services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: organiser_test
      POSTGRES_USER: organiser
      POSTGRES_PASSWORD: test-only-password
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U organiser -d organiser_test']
      interval: 2s
      timeout: 5s
      retries: 15
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql://organiser:test-only-password@postgres/organiser_test
    depends_on:
      postgres:
        condition: service_healthy
