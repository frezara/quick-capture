name: Release

# Fires on a version tag push (recommended flow: `git tag v0.1.0 && git push --tags`)
# or via manual dispatch from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # needed by softprops/action-gh-release to create/attach to a Release

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install build tools
        run: brew install xcodegen create-dmg

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, ad-hoc signed)
        run: |
          xcodebuild \
            -project QuickCapture.xcodeproj \
            -scheme QuickCapture \
            -configuration Release \
            -derivedDataPath build/ \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run tests
        run: |
          xcodebuild \
            -project QuickCapture.xcodeproj \
            -scheme QuickCapture \
            -derivedDataPath build/ \
            test

      - name: Package DMG
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/Release -maxdepth 2 -name "Quick Capture.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Could not find built .app"; exit 1
          fi
          mkdir -p dist/stage
          cp -R "$APP_PATH" dist/stage/
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="dev-$(date +%Y%m%d-%H%M%S)"; fi
          DMG="dist/QuickCapture-${VERSION}.dmg"
          # create-dmg gives us a sized window with the app on the left and a
          # drag-to-/Applications target on the right. Falls back gracefully
          # if the AppleScript layout step fails on the headless CI runner.
          create-dmg \
            --volname "Quick Capture" \
            --window-pos 200 120 \
            --window-size 540 380 \
            --icon-size 100 \
            --icon "Quick Capture.app" 140 190 \
            --hide-extension "Quick Capture.app" \
            --app-drop-link 400 190 \
            --no-internet-enable \
            "$DMG" \
            "dist/stage/"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickCapture-dmg
          path: dist/*.dmg

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
